# ========== 通用检测模式（用于 stage 3 evidence 检测） ==========
detection_signatures:
  execve_indicators:
    - "/bin/sh"
    - "/bin/bash"
    - "rm -rf"
    - "curl"
    - "wget"
    - "nc"
    - "/dev/tcp"
    - "chmod +x"
  network_indicators:
    - "169.254.169.254"
    - "metadata.google.internal"
    - "metadata.azure.com"
    - "127.0.0.1"
    - "localhost"
  data_exfil_indicators:
    - "/etc/passwd"
    - "/etc/shadow"
    - "AWS_SECRET"
    - "sk-"
    - "AKIA"
  response_indicators:
    - "root:x:0:0:"
    - "BEGIN RSA PRIVATE KEY"
    - "api_key="
