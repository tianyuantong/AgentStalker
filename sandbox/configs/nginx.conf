# AgentStalker Nginx 反向代理
# - 接收 test-runner 的攻击请求
# - 转发至 agent-under-test
# - 完整记录 request/response 到 access.log
# - 支持 SSE 流式响应

worker_processes 1;
events {
    worker_connections 1024;
}

http {
    log_format ast_log escape=json
        '{'
            '"ts":"$time_iso8601",'
            '"client":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"req_body":$request_body,'
            '"resp_body":$resp_body,'
            '"ua":"$http_user_agent",'
            '"session":"$http_x_session_id"'
        '}';

    access_log /var/log/nginx/access.log ast_log buffer=32k flush=5s;
    error_log  /var/log/nginx/error.log warn;

    # 捕获 response body（关键：用于事后分析 agent 实际回复）
    log_format ast_log_post $request_body;

    # 上游 - agent 容器
    upstream agent_upstream {
        server agent-under-test:8000;
        keepalive 16;
    }

    server {
        listen 8000;

        # 强制记录 response body
        lua_need_request_body on;
        body_filter_by_lua_block {
            local resp_body = ngx.arg[1]
            ngx.var.resp_body_capture = resp_body
        }
        set $resp_body_capture "";

        # 主入口 - Agent Chat
        location /chat {
            proxy_pass http://agent_upstream/chat;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Session-Id $http_x_session_id;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }

        # 工具调用入口（部分 Agent 暴露独立 endpoint）
        location /tools/ {
            proxy_pass http://agent_upstream/tools/;
            proxy_set_header Host $host;
            proxy_set_header X-Session-Id $http_x_session_id;
        }

        # 健康检查
        location /health {
            proxy_pass http://agent_upstream/health;
        }

        # 阻断 - 沙箱内不允许的路径
        location ~ ^/(admin|internal|debug) {
            return 403;
        }
    }
}
