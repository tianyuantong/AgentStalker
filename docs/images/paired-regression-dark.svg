<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="t d">
<title id="t">Paired remediation regression: vulnerable vs fixed variant</title>
<desc id="d">Attack cases with a confirmed effect 6 to 0; public proxy requests leaking the credential 3 to 0; normal tasks completed 6 to 6; execution failures 0 to 0. 12 cases per variant.</desc>
<rect width="760" height="300" fill="#1a1a19"/>
<text x="24" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#ffffff">Paired remediation regression</text>
<text x="24" y="54" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c3c2b7">12 cases per variant · same suite, analyzer and fixture · verdicts recomputed from raw observations</text>
<circle cx="29" cy="78" r="5" fill="#184f95"/>
<text x="40" y="82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c3c2b7">vulnerable (before)</text>
<circle cx="174" cy="78" r="5" fill="#6da7ec"/>
<text x="185" y="82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c3c2b7">fixed (after)</text>
<line x1="330.0" y1="100" x2="330.0" y2="262" stroke="#2c2c2a" stroke-width="1"/>
<text x="330.0" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#898781" text-anchor="middle">0</text>
<line x1="450.0" y1="100" x2="450.0" y2="262" stroke="#2c2c2a" stroke-width="1"/>
<text x="450.0" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#898781" text-anchor="middle">2</text>
<line x1="570.0" y1="100" x2="570.0" y2="262" stroke="#2c2c2a" stroke-width="1"/>
<text x="570.0" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#898781" text-anchor="middle">4</text>
<line x1="690.0" y1="100" x2="690.0" y2="262" stroke="#2c2c2a" stroke-width="1"/>
<text x="690.0" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#898781" text-anchor="middle">6</text>
<line x1="330" y1="262" x2="690" y2="262" stroke="#383835" stroke-width="1"/>
<text x="510" y="298" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#898781" text-anchor="middle">cases (out of 6 in each group)</text>
<text x="316" y="118.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="end">Attack cases with a confirmed effect</text>
<line x1="690.0" y1="114.0" x2="330.0" y2="114.0" stroke="#898781" stroke-width="2" stroke-linecap="round"/>
<circle cx="690.0" cy="114.0" r="7" fill="#1a1a19"/>
<circle cx="690.0" cy="114.0" r="5" fill="#184f95"/>
<circle cx="330.0" cy="114.0" r="7" fill="#1a1a19"/>
<circle cx="330.0" cy="114.0" r="5" fill="#6da7ec"/>
<text x="712" y="118.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c3c2b7">6 → 0</text>
<text x="316" y="162.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="end">Public proxy requests leaking the credential</text>
<line x1="510.0" y1="158.0" x2="330.0" y2="158.0" stroke="#898781" stroke-width="2" stroke-linecap="round"/>
<circle cx="510.0" cy="158.0" r="7" fill="#1a1a19"/>
<circle cx="510.0" cy="158.0" r="5" fill="#184f95"/>
<circle cx="330.0" cy="158.0" r="7" fill="#1a1a19"/>
<circle cx="330.0" cy="158.0" r="5" fill="#6da7ec"/>
<text x="712" y="162.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c3c2b7">3 → 0</text>
<text x="316" y="206.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="end">Normal tasks completed</text>
<circle cx="690.0" cy="202.0" r="7" fill="#1a1a19"/>
<circle cx="690.0" cy="202.0" r="5" fill="#184f95"/>
<circle cx="690.0" cy="202.0" r="7" fill="#1a1a19"/>
<circle cx="690.0" cy="202.0" r="5" fill="#6da7ec"/>
<text x="712" y="206.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c3c2b7">6 → 6</text>
<text x="316" y="250.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="end">Execution failures</text>
<circle cx="330.0" cy="246.0" r="7" fill="#1a1a19"/>
<circle cx="330.0" cy="246.0" r="5" fill="#184f95"/>
<circle cx="330.0" cy="246.0" r="7" fill="#1a1a19"/>
<circle cx="330.0" cy="246.0" r="5" fill="#6da7ec"/>
<text x="712" y="250.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c3c2b7">0 → 0</text>
</svg>
